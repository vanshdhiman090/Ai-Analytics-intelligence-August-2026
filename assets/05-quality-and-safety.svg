<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Data quality and analytical safety gates</title>
  <desc id="desc">Two paths contrast trustworthy data that proceeds to an evidence-backed conclusion with unsafe or insufficient data that triggers abstention or caveats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#0a1d2a"/></linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2dd4bf"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#02070c" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg)"/>
  <text x="70" y="68" fill="#f3f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="760">Quality gates protect the conclusion</text>
  <text x="70" y="101" fill="#91aabd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">The system can stop, caveat, or preserve only the evidence that remains valid.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 150)">
      <rect width="600" height="490" rx="22" fill="#0b292f" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="24" y="24" width="174" height="32" rx="16" fill="#123c3f"/>
      <circle cx="43" cy="40" r="6" fill="#2dd4bf"/>
      <text x="59" y="45" fill="#85ece0" font-size="12" font-weight="700" letter-spacing="1.3">TRUSTWORTHY DATA</text>
      <text x="24" y="96" fill="#effaf8" font-size="24" font-weight="700">Evidence is safe to test</text>
      <g transform="translate(24 128)" fill="#d9efeb" font-size="16">
        <rect width="552" height="48" rx="10" fill="#10343b"/><text x="18" y="30">✓ Valid and distinct periods</text>
        <rect y="60" width="552" height="48" rx="10" fill="#10343b"/><text x="18" y="90">✓ Adequate comparison coverage</text>
        <rect y="120" width="552" height="48" rx="10" fill="#10343b"/><text x="18" y="150">✓ Complete additive KPI values</text>
        <rect y="180" width="552" height="48" rx="10" fill="#10343b"/><text x="18" y="210">✓ Reconciled signed arithmetic</text>
        <rect y="240" width="552" height="48" rx="10" fill="#10343b"/><text x="18" y="270">✓ Evidence bounded to the tested scope</text>
      </g>
      <path d="M300 436 V458" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowGreen)"/>
      <rect x="150" y="462" width="300" height="62" rx="14" fill="#123c3f" stroke="#2dd4bf"/>
      <text x="300" y="489" text-anchor="middle" fill="#effaf8" font-size="16" font-weight="700">Investigation proceeds</text>
      <text x="300" y="511" text-anchor="middle" fill="#9bcac3" font-size="13">Evidence-backed bounded conclusion</text>
    </g>

    <g transform="translate(730 150)">
      <rect width="600" height="490" rx="22" fill="#2a2417" stroke="#f59e0b" stroke-width="2"/>
      <rect x="24" y="24" width="218" height="32" rx="16" fill="#3d321b"/>
      <circle cx="43" cy="40" r="6" fill="#f59e0b"/>
      <text x="59" y="45" fill="#fbd37b" font-size="12" font-weight="700" letter-spacing="1.3">UNSAFE / INSUFFICIENT</text>
      <text x="24" y="96" fill="#fff7e8" font-size="24" font-weight="700">Interpretation must stop or narrow</text>
      <g transform="translate(24 128)" fill="#f3e7cf" font-size="16">
        <rect width="552" height="48" rx="10" fill="#352c1c"/><text x="18" y="30">! Missing requested period</text>
        <rect y="60" width="552" height="48" rx="10" fill="#352c1c"/><text x="18" y="90">! Invalid or ambiguous dates</text>
        <rect y="120" width="552" height="48" rx="10" fill="#352c1c"/><text x="18" y="150">! Incomplete comparison coverage</text>
        <rect y="180" width="552" height="48" rx="10" fill="#352c1c"/><text x="18" y="210">! Insufficient scoped rows</text>
        <rect y="240" width="552" height="48" rx="10" fill="#352c1c"/><text x="18" y="270">! KPI completeness failure</text>
      </g>
      <path d="M300 436 V458" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
      <rect x="150" y="462" width="300" height="62" rx="14" fill="#3d321b" stroke="#f59e0b"/>
      <text x="300" y="489" text-anchor="middle" fill="#fff7e8" font-size="16" font-weight="700">Quality gate</text>
      <text x="300" y="511" text-anchor="middle" fill="#dcc58f" font-size="13">Abstain · caveat · request evidence</text>
    </g>
  </g>

  <g transform="translate(70 686)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="1260" height="86" rx="16" fill="#081a27" stroke="#203d50"/>
    <g transform="translate(24 22)"><circle cx="8" cy="8" r="7" fill="#f59e0b"/><text x="28" y="13" fill="#d8e5ee" font-size="14" font-weight="700">Contribution ≠ causation</text></g>
    <g transform="translate(355 22)"><circle cx="8" cy="8" r="7" fill="#60a5fa"/><text x="28" y="13" fill="#d8e5ee" font-size="14" font-weight="700">Robustness belongs to its tested target scope</text></g>
    <g transform="translate(860 22)"><circle cx="8" cy="8" r="7" fill="#2dd4bf"/><text x="28" y="13" fill="#d8e5ee" font-size="14" font-weight="700">Downstream weakness preserves valid upstream evidence</text></g>
    <text x="24" y="63" fill="#7795aa" font-size="13">Quality does not decorate the result. It controls whether and where the result may be interpreted.</text>
  </g>
</svg>
