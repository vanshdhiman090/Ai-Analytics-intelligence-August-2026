<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">AI Analytics Intelligence capability architecture</title>
  <desc id="desc">A shared analytics platform supports one current implemented capability, Root Cause Investigation, while Forecasting, Anomaly Detection, and Scenario Analysis are clearly marked as future possibilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#0a1d2a"/></linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d3035"/><stop offset="1" stop-color="#102b40"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#02070c" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1400" height="780" rx="26" fill="url(#bg)"/>
  <text x="70" y="68" fill="#f3f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="760">One platform, independent specialist capabilities</text>
  <text x="70" y="101" fill="#91aabd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Shared infrastructure does not blur analytical contracts.</text>

  <g transform="translate(70 145)" font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect width="1260" height="190" rx="22" fill="url(#platform)" stroke="#3b7188"/>
    <rect x="24" y="24" width="236" height="34" rx="17" fill="#17394a"/>
    <text x="42" y="46" fill="#b8d3e3" font-size="12" font-weight="700" letter-spacing="1.5">AI ANALYTICS INTELLIGENCE</text>
    <text x="24" y="95" fill="#f2f8fc" font-size="25" font-weight="700">Shared platform foundation</text>
    <g transform="translate(24 122)" font-size="14">
      <g><rect width="182" height="42" rx="10" fill="#102c3a"/><text x="16" y="26" fill="#c5d8e4">Dataset ingestion</text></g>
      <g transform="translate(197)"><rect width="180" height="42" rx="10" fill="#102c3a"/><text x="16" y="26" fill="#c5d8e4">Profiling</text></g>
      <g transform="translate(392)"><rect width="215" height="42" rx="10" fill="#102c3a"/><text x="16" y="26" fill="#c5d8e4">Governed lifecycle</text></g>
      <g transform="translate(622)"><rect width="180" height="42" rx="10" fill="#102c3a"/><text x="16" y="26" fill="#c5d8e4">App shell + themes</text></g>
      <g transform="translate(817)"><rect width="195" height="42" rx="10" fill="#102c3a"/><text x="16" y="26" fill="#c5d8e4">API + safe errors</text></g>
      <g transform="translate(1027)"><rect width="185" height="42" rx="10" fill="#102c3a"/><text x="16" y="26" fill="#c5d8e4">Health + CI gates</text></g>
    </g>
  </g>

  <g stroke="#355a70" stroke-width="2"><path d="M700 335 V382"/><path d="M250 382 H1150"/><path d="M250 382 V420"/><path d="M550 382 V420"/><path d="M850 382 V420"/><path d="M1150 382 V420"/></g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 420)">
      <rect width="360" height="250" rx="22" fill="#0d2d37" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="24" y="24" width="150" height="32" rx="16" fill="#124048" stroke="#2dd4bf"/>
      <circle cx="44" cy="40" r="6" fill="#2dd4bf"/><text x="59" y="45" fill="#8ef0e5" font-size="12" font-weight="700" letter-spacing="1.4">CURRENT · V1</text>
      <text x="24" y="102" fill="#f0faf8" font-size="25" font-weight="700">Root Cause</text>
      <text x="24" y="133" fill="#f0faf8" font-size="25" font-weight="700">Investigation</text>
      <text x="24" y="171" fill="#a3c9c3" font-size="14">Implemented specialist workflow</text>
      <text x="24" y="198" fill="#8eb5ae" font-size="13">Governed contribution analysis</text>
      <text x="24" y="220" fill="#8eb5ae" font-size="13">Quality gates · evidence · abstention</text>
    </g>

    <g transform="translate(470 420)">
      <rect width="260" height="250" rx="22" fill="#0a1d2a" stroke="#344c5d" stroke-dasharray="8 7"/>
      <rect x="24" y="24" width="92" height="30" rx="15" fill="#172735"/><text x="46" y="44" fill="#71889a" font-size="11" font-weight="700" letter-spacing="1.4">FUTURE</text>
      <text x="24" y="102" fill="#a8bac7" font-size="22" font-weight="700">Forecasting</text>
      <text x="24" y="139" fill="#677f91" font-size="13">Not implemented</text>
      <text x="24" y="178" fill="#60798b" font-size="13">Own contract, engine,</text>
      <text x="24" y="199" fill="#60798b" font-size="13">validation, evaluation, UI</text>
    </g>

    <g transform="translate(770 420)">
      <rect width="260" height="250" rx="22" fill="#0a1d2a" stroke="#344c5d" stroke-dasharray="8 7"/>
      <rect x="24" y="24" width="92" height="30" rx="15" fill="#172735"/><text x="46" y="44" fill="#71889a" font-size="11" font-weight="700" letter-spacing="1.4">FUTURE</text>
      <text x="24" y="102" fill="#a8bac7" font-size="22" font-weight="700">Anomaly Detection</text>
      <text x="24" y="139" fill="#677f91" font-size="13">Not implemented</text>
      <text x="24" y="178" fill="#60798b" font-size="13">Independent semantics</text>
      <text x="24" y="199" fill="#60798b" font-size="13">and release evidence</text>
    </g>

    <g transform="translate(1070 420)">
      <rect width="260" height="250" rx="22" fill="#0a1d2a" stroke="#344c5d" stroke-dasharray="8 7"/>
      <rect x="24" y="24" width="92" height="30" rx="15" fill="#172735"/><text x="46" y="44" fill="#71889a" font-size="11" font-weight="700" letter-spacing="1.4">FUTURE</text>
      <text x="24" y="102" fill="#a8bac7" font-size="22" font-weight="700">Scenario Analysis</text>
      <text x="24" y="139" fill="#677f91" font-size="13">Not implemented</text>
      <text x="24" y="178" fill="#60798b" font-size="13">Independent assumptions</text>
      <text x="24" y="199" fill="#60798b" font-size="13">and decision boundaries</text>
    </g>
  </g>

  <text x="700" y="730" text-anchor="middle" fill="#7893a6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">A future capability is added only with its own bounded problem, contract, deterministic validation, and answer-keyed evaluation.</text>
</svg>
