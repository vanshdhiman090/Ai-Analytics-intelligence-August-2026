<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5A7A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1000" fill="#0B1120"/>
  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#E5E9F0">System Architecture &#8212; Public Request Path</text>

  <!-- Box template: x=130 width=640 height=80 -->

  <!-- 1 -->
  <rect x="130" y="65" width="640" height="80" rx="8" fill="#131C2E" stroke="#2C3A57" stroke-width="1.5"/>
  <text x="155" y="98" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">1. Next.js Investigation Workspace</text>
  <text x="155" y="120" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Collects the dataset and bounded configuration</text>
  <line x1="450" y1="145" x2="450" y2="188" stroke="#4A5A7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="130" y="190" width="640" height="80" rx="8" fill="#131C2E" stroke="#2C3A57" stroke-width="1.5"/>
  <text x="155" y="223" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">2. POST /datasets</text>
  <text x="155" y="245" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Validates, profiles deterministically, returns an opaque UUID</text>
  <line x1="450" y1="270" x2="450" y2="313" stroke="#4A5A7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="130" y="315" width="640" height="80" rx="8" fill="#131C2E" stroke="#2C3A57" stroke-width="1.5"/>
  <text x="155" y="348" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">3. POST /v1/rca/investigations</text>
  <text x="155" y="370" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Validates the public typed contract, resolves the server-owned dataset</text>
  <line x1="450" y1="395" x2="450" y2="438" stroke="#4A5A7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="130" y="440" width="640" height="80" rx="8" fill="#131C2E" stroke="#2C3A57" stroke-width="1.5"/>
  <text x="155" y="473" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">4. Governed RCA Service</text>
  <text x="155" y="495" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Maps public inputs to internal contracts &#8212; depth and thresholds server-owned</text>
  <line x1="450" y1="520" x2="450" y2="563" stroke="#4A5A7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="130" y="565" width="640" height="80" rx="8" fill="#131C2E" stroke="#2C3A57" stroke-width="1.5"/>
  <text x="155" y="598" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">5. Deterministic Investigation Runtime</text>
  <text x="155" y="620" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">KPI movement, signed contributions, offsets, quality checks, reconciliation</text>
  <line x1="450" y1="645" x2="450" y2="688" stroke="#4A5A7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 -->
  <rect x="130" y="690" width="640" height="80" rx="8" fill="#131C2E" stroke="#2DD4BF" stroke-width="2"/>
  <text x="155" y="723" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">6. Verification &amp; Conclusion Compiler</text>
  <text x="155" y="745" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Five deterministic challenges limit the conclusion to what evidence supports</text>
  <line x1="450" y1="770" x2="450" y2="813" stroke="#4A5A7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 -->
  <rect x="130" y="815" width="640" height="80" rx="8" fill="#131C2E" stroke="#2C3A57" stroke-width="1.5"/>
  <text x="155" y="848" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E5E9F0">7. Public Response Mapper</text>
  <text x="155" y="870" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Exposes only the typed, allow-listed result the frontend requires</text>

  <text x="450" y="940" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#5C6B8A">PostgreSQL (Neon) stores application metadata across the request path.</text>
  <text x="450" y="962" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#5C6B8A">The historical LangGraph workflow is not the execution path for this endpoint.</text>
</svg>
