<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">AI and deterministic analytics responsibility boundary</title>
  <desc id="desc">Three separated layers show optional AI assistance, deterministic analytics, and policy verification, with a central principle that AI chooses bounded tests, code calculates, and evidence limits claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#0a1d2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#02070c" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1400" height="860" rx="26" fill="url(#bg)"/>
  <text x="70" y="68" fill="#f3f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="760">AI judgment, deterministic calculation, governed claims</text>
  <text x="70" y="101" fill="#91aabd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Each responsibility has a strict boundary.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 150)">
      <rect width="1260" height="186" rx="20" fill="#10283a" stroke="#60a5fa" stroke-width="2"/>
      <rect width="250" height="186" rx="20" fill="#0e2233"/>
      <text x="28" y="40" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.5">OPTIONAL ASSISTANCE</text>
      <text x="28" y="78" fill="#f2f8fc" font-size="24" font-weight="700">Agent / LLM</text>
      <text x="28" y="108" fill="#9fb5c5" font-size="14">Bounded analytical judgment</text>
      <g transform="translate(292 34)">
        <text fill="#67e8d6" font-size="12" font-weight="700" letter-spacing="1.4">MAY</text>
        <text y="31" fill="#dce9f2" font-size="15">• Prioritize allowed tests</text><text y="59" fill="#dce9f2" font-size="15">• Choose a bounded next investigation</text><text y="87" fill="#dce9f2" font-size="15">• Interpret verified state</text>
      </g>
      <g transform="translate(755 34)">
        <text fill="#fca5a5" font-size="12" font-weight="700" letter-spacing="1.4">MAY NOT</text>
        <text y="31" fill="#dce9f2" font-size="15">• Calculate KPI or contribution values</text><text y="59" fill="#dce9f2" font-size="15">• Execute generated Python or SQL</text><text y="87" fill="#dce9f2" font-size="15">• Change thresholds or bypass gates</text><text y="115" fill="#dce9f2" font-size="15">• Invent evidence or causal certainty</text>
      </g>
    </g>

    <g transform="translate(70 370)">
      <rect width="1260" height="176" rx="20" fill="#0d2c38" stroke="#2dd4bf" stroke-width="2"/>
      <rect width="250" height="176" rx="20" fill="#0b252e"/>
      <text x="28" y="40" fill="#67e8d6" font-size="12" font-weight="700" letter-spacing="1.5">SOURCE OF NUMBERS</text>
      <text x="28" y="78" fill="#f2f8fc" font-size="24" font-weight="700">Deterministic analytics</text>
      <text x="28" y="108" fill="#9fc7c1" font-size="14">Python over typed contracts</text>
      <g transform="translate(292 35)">
        <text fill="#67e8d6" font-size="12" font-weight="700" letter-spacing="1.4">RESPONSIBLE FOR</text>
        <text y="35" fill="#dff5f1" font-size="16">KPI arithmetic</text><text x="245" y="35" fill="#dff5f1" font-size="16">Signed contributions</text><text x="525" y="35" fill="#dff5f1" font-size="16">Period comparisons</text>
        <text y="78" fill="#dff5f1" font-size="16">Decomposition</text><text x="245" y="78" fill="#dff5f1" font-size="16">Positive offsets</text><text x="525" y="78" fill="#dff5f1" font-size="16">Reconciliation tie-out</text>
        <text y="121" fill="#8edbcf" font-size="13">Reproducible · testable · auditable</text>
      </g>
    </g>

    <g transform="translate(70 580)">
      <rect width="1260" height="176" rx="20" fill="#2d2516" stroke="#f59e0b" stroke-width="2"/>
      <rect width="250" height="176" rx="20" fill="#251f14"/>
      <text x="28" y="40" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1.5">CLAIM BOUNDARY</text>
      <text x="28" y="78" fill="#fff7e8" font-size="24" font-weight="700">Policy + verification</text>
      <text x="28" y="108" fill="#d8c8a7" font-size="14">Independent publication limits</text>
      <g transform="translate(292 35)">
        <text fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1.4">RESPONSIBLE FOR</text>
        <text y="35" fill="#f5ead4" font-size="16">Server-owned thresholds</text><text x="285" y="35" fill="#f5ead4" font-size="16">Evidence scope</text><text x="525" y="35" fill="#f5ead4" font-size="16">Data-quality gates</text>
        <text y="78" fill="#f5ead4" font-size="16">Robustness applicability</text><text x="285" y="78" fill="#f5ead4" font-size="16">Conclusion limits</text><text x="525" y="78" fill="#f5ead4" font-size="16">Abstention</text>
        <text y="121" fill="#dfc47f" font-size="13">Evidence controls the strongest statement the system may publish.</text>
      </g>
    </g>
  </g>

  <g transform="translate(182 790)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="23" fill="#93c5fd" font-size="19" font-weight="700">AI helps decide what to test.</text>
    <circle cx="335" cy="17" r="4" fill="#38566b"/>
    <text x="365" y="23" fill="#67e8d6" font-size="19" font-weight="700">Code calculates.</text>
    <circle cx="590" cy="17" r="4" fill="#38566b"/>
    <text x="620" y="23" fill="#fbbf24" font-size="19" font-weight="700">Evidence limits what may be claimed.</text>
  </g>
</svg>
