<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Root Cause Investigation Agent</title>
  <desc id="desc">A premium dark analytical banner showing the progression from a business KPI movement to bounded investigation, verified evidence, and a bounded conclusion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.55" stop-color="#0a1d2c"/>
      <stop offset="1" stop-color="#071722"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02070c" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1400" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="100" r="280" fill="url(#glow)"/>
  <path d="M0 360 C260 310 410 430 690 360 S1120 300 1400 355" fill="none" stroke="#183449" stroke-width="2"/>
  <path d="M0 386 C280 336 445 447 730 382 S1140 326 1400 380" fill="none" stroke="#102b3d" stroke-width="1"/>

  <g transform="translate(70 55)">
    <rect x="0" y="0" width="248" height="34" rx="17" fill="#102b3d" stroke="#24506b"/>
    <circle cx="20" cy="17" r="5" fill="#2dd4bf"/>
    <text x="36" y="22" fill="#9cb7cb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">AI ANALYTICS INTELLIGENCE</text>
    <text x="0" y="95" fill="#f3f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="760">AI Root Cause</text>
    <text x="0" y="151" fill="#f3f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="760">Investigation Agent</text>
    <rect x="0" y="178" width="640" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="222" fill="#a9bfd1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">From KPI movement to evidence-backed investigation.</text>
  </g>

  <g transform="translate(690 150)" filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect width="150" height="108" rx="16" fill="#0d2536" stroke="#27475c"/>
      <text x="75" y="35" text-anchor="middle" fill="#7fa0b8" font-size="12" font-weight="700" letter-spacing="1.4">BUSINESS</text>
      <text x="75" y="58" text-anchor="middle" fill="#eaf4fb" font-size="16" font-weight="700">KPI movement</text>
      <path d="M36 82 L58 70 L80 78 L112 57" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="112" cy="57" r="4" fill="#f59e0b"/>
    </g>
    <g transform="translate(178 0)">
      <rect width="150" height="108" rx="16" fill="#0d2536" stroke="#2dd4bf"/>
      <text x="75" y="35" text-anchor="middle" fill="#67e8d6" font-size="12" font-weight="700" letter-spacing="1.4">BOUNDED</text>
      <text x="75" y="58" text-anchor="middle" fill="#eaf4fb" font-size="16" font-weight="700">Investigation</text>
      <circle cx="51" cy="82" r="7" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="99" cy="82" r="7" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <path d="M58 82 H92" stroke="#2dd4bf" stroke-width="2"/>
    </g>
    <g transform="translate(356 0)">
      <rect width="150" height="108" rx="16" fill="#0d2536" stroke="#60a5fa"/>
      <text x="75" y="35" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.4">VERIFIED</text>
      <text x="75" y="58" text-anchor="middle" fill="#eaf4fb" font-size="16" font-weight="700">Evidence</text>
      <path d="M49 81 L67 94 L101 68" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(534 0)">
      <rect width="150" height="108" rx="16" fill="#0d2536" stroke="#f59e0b"/>
      <text x="75" y="35" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1.4">BOUNDED</text>
      <text x="75" y="58" text-anchor="middle" fill="#eaf4fb" font-size="16" font-weight="700">Conclusion</text>
      <rect x="47" y="74" width="56" height="20" rx="10" fill="#382a12" stroke="#f59e0b"/>
      <text x="75" y="88" text-anchor="middle" fill="#fcd78a" font-size="10" font-weight="700">CAVEATS</text>
    </g>
    <g fill="#507188">
      <path d="M156 50 H170 L166 46 M170 50 L166 54" stroke="#507188" stroke-width="2" fill="none"/>
      <path d="M334 50 H348 L344 46 M348 50 L344 54" stroke="#507188" stroke-width="2" fill="none"/>
      <path d="M512 50 H526 L522 46 M526 50 L522 54" stroke="#507188" stroke-width="2" fill="none"/>
    </g>
  </g>
  <text x="1032" y="302" text-anchor="middle" fill="#7f9bae" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Deterministic math · governed evidence · explicit uncertainty</text>
</svg>
